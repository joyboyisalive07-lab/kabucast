name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Provenance is the only verifiable answer this project can give about where
  # a binary came from; it cannot buy a code-signing certificate.
  id-token: write
  attestations: write

jobs:
  release:
    # Windows because the executable is a Windows executable; the offline page
    # is byte-identical wherever it is built.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Build the executable
        run: >
          python -m PyInstaller --onefile --noconsole --name kabucast
          --icon dist/kabucast.ico
          --add-data "dist/kabucast-offline.html;."
          --distpath dist --workpath build/pyinstaller
          tools/kabucast_launcher.py

      - name: Check the artifacts exist and are self-contained
        shell: bash
        run: |
          test -s dist/kabucast-offline.html
          test -s dist/kabucast.exe
          grep -q "<script type=\"module\">" dist/kabucast-offline.html
          ! grep -q 'src="./main.js"' dist/kabucast-offline.html
          ! grep -q 'href="./styles.css"' dist/kabucast-offline.html

      - name: Write checksums
        shell: bash
        run: |
          cd dist
          sha256sum kabucast-offline.html kabucast.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/kabucast-offline.html
            dist/kabucast.exe

      - name: Publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          Three files. Take whichever suits the machine you are on.

          | File | What it is |
          | --- | --- |
          | `kabucast-offline.html` | The whole tool in one file. Open it from your filesystem; no server, no network, no install. Works on a phone too. |
          | `kabucast.exe` | The same page carried inside a small Windows program that opens it in your default browser. |
          | `SHA256SUMS.txt` | Checksums for both. |

          On a phone, use the hosted version at
          https://joyboyisalive07-lab.github.io/kabucast/ and add it to your home
          screen, or open the HTML file directly. There is nothing to install.

          **Windows will warn about the executable.** It is unsigned. Removing
          that warning needs a code-signing certificate issued to a verified
          legal identity, which this project does not have and cannot fake; a
          self-signed certificate changes nothing, because nothing trusts it.
          What is offered instead is provenance you can check yourself:

          ```
          gh attestation verify kabucast.exe --repo joyboyisalive07-lab/kabucast
          ```

          That proves the file came out of the public build in this repository
          and not from anywhere else. The checksums in `SHA256SUMS.txt` let you
          confirm the download matches. If that is not enough, the HTML file
          triggers no warning at all and does exactly the same thing.

          How the numbers are computed, and how they were checked against a
          million simulated weeks, is in
          [docs/CALIBRATION.md](https://github.com/joyboyisalive07-lab/kabucast/blob/main/docs/CALIBRATION.md).
          NOTES
          # Idempotent, because a tag can legitimately be moved onto a
          # corrected commit before anyone has downloaded anything. Creating
          # afresh is the normal path; replacing the assets is the correction
          # path, and it must not leave the previous build attached.
          files="dist/kabucast-offline.html dist/kabucast.exe dist/SHA256SUMS.txt"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
            # shellcheck disable=SC2086
            gh release upload "${GITHUB_REF_NAME}" $files --clobber
          else
            # shellcheck disable=SC2086
            gh release create "${GITHUB_REF_NAME}" $files \
              --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
